<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STEM Road Trip Race</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one paper-framed game screen, level chips above, crayon touch pad below */
:root{
  --bg:#eef1e6; --paper:#fbfbf7; --ink:#2f3330; --muted:#69705f; --green:#3f8f3a; --leaf:#9dc43f; --red:#c8432f; --line:#d4dac6;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c201b;--paper:#2a2f28;--ink:#eceee6;--muted:#a6ae9c;--green:#7fc277;--leaf:#b4d65e;--red:#e0705f;--line:#3a4236;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c201b;--paper:#2a2f28;--ink:#eceee6;--muted:#a6ae9c;--green:#7fc277;--leaf:#b4d65e;--red:#e0705f;--line:#3a4236;color-scheme:dark}
html,body{overscroll-behavior:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--hand);font-weight:400;font-size:1.8rem;margin:0;line-height:1}
.levels{display:flex;gap:6px;align-items:center;font-family:var(--hand);font-size:1.05rem;color:var(--muted)}
.levels span[data-l]{display:inline-grid;place-items:center;font-size:1.1rem;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);color:var(--muted)}
.levels span.done{border-color:var(--green);color:var(--green)}
.levels span.cur{background:var(--green);border-color:var(--green);color:#fff}
.levels .arrow{color:var(--muted)}
.stage{position:relative;background:#fbfbf7;padding:8px;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 12px rgb(0 0 0 / .1)}
canvas{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:4/5;touch-action:none;outline:none}
canvas:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.overlay{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:rgb(251 251 247 / .86);color:#2f3330;font-family:var(--hand);padding:20px}
.overlay .lvl{font-size:1.1rem;color:#69705f;letter-spacing:.08em;margin:0}
.overlay h2{font-weight:400;font-size:2.4rem;margin:0;line-height:1;text-wrap:balance}
.overlay h2.win{font-size:4rem;color:#3f8f3a}
.overlay p{margin:0;font-size:1.25rem;max-width:30ch;line-height:1.3}
.overlay .big{font-size:2.6rem;color:#c8432f;line-height:1.1}
.go{font-family:var(--hand);font-size:1.5rem;background:#3f8f3a;color:#fff;border:0;border-radius:999px;padding:8px 28px;cursor:pointer;margin-top:6px}
.go:focus-visible,.pad button:focus-visible,.levels span:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.keys{display:inline-flex;gap:4px;align-items:center}
kbd{font-family:var(--body);font-size:.9rem;border:1.5px solid #2f3330;border-radius:5px;padding:0 6px;background:#fff}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;user-select:none;-webkit-user-select:none}
.pad button{font-family:var(--hand);font-size:1.6rem;line-height:1;padding:14px 0;border-radius:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);touch-action:none;cursor:pointer}
.pad button.on{background:var(--leaf);color:#1f2a12}
.pad .gas{background:var(--green);color:#fff;border-color:var(--green)}
.pad .brake{background:var(--red);color:#fff;border-color:var(--red)}
.pad span{display:block;font-size:.85rem;margin-top:2px}
.help{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style>

<div class="wrap">
  <header>
    <h1>STEM Road Trip</h1>
    <div class="levels" id="levels">Level
      <span data-l="0">1</span><span class="arrow">›</span><span data-l="1">2</span><span class="arrow">›</span><span data-l="2">3</span>
    </div>
  </header>
  <div class="stage">
    <canvas id="c" width="640" height="800" tabindex="0" aria-label="Crayon racing game. Use the arrow keys to drive."></canvas>
    <div class="overlay" id="ov">
      <p class="lvl" id="ovLvl">LEVEL 1</p>
      <h2 id="ovTitle">Meadow road</h2>
      <p id="ovText"></p>
      <p class="keys" id="ovKeys"><kbd>↑</kbd> go <kbd>↓</kbd> brake <kbd>←</kbd><kbd>→</kbd> steer</p>
      <button class="go" id="goBtn" type="button">Start race</button>
    </div>
  </div>
  <div class="pad" aria-label="Touch controls">
    <button type="button" data-k="left" aria-label="Steer left">←<span>left</span></button>
    <button type="button" data-k="right" aria-label="Steer right">→<span>right</span></button>
    <button type="button" class="brake" data-k="down" aria-label="Brake">↓<span>brake</span></button>
    <button type="button" class="gas" data-k="up" aria-label="Go">↑<span>go</span></button>
  </div>
  <p class="help" id="help">Three levels in a row: finish 1st and the next level starts right away. Stars are 10 points, S T E M letters give a turbo.</p>
</div>

// ---- crayon drawing helpers for the new pieces
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
let hseed=3;const hr=()=>{hseed=(hseed*16807)%2147483647;return (hseed-1)/2147483646};
function crayon(g,path,fill,shade,bx,by,bw,bh,lw=3,outline=C.pencil){
  g.save();g.fillStyle=fill;g.fill(path);g.clip(path);g.strokeStyle=shade;g.lineWidth=2;g.globalAlpha=.35;g.beginPath();
  for(let i=0;i<(bw*bh)/60;i++){const x=bx+hr()*bw,y=by+hr()*bh;g.moveTo(x,y);g.lineTo(x+8+hr()*10,y-6-hr()*8)}g.stroke();g.restore();
  if(outline){g.strokeStyle=outline;g.lineWidth=lw;g.lineJoin="round";g.stroke(path)}}
function blob(cx,cy,rx,ry,n,j){const p=new Path2D();for(let i=0;i<=n;i++){const t=i/n*Math.PI*2,r=1+(hr()-.5)*j;p[i?'lineTo':'moveTo'](cx+Math.cos(t)*rx*r,cy+Math.sin(t)*ry*r)}p.closePath();return p}
const PIECE={
  star:mk(130,130,(g)=>{const p=new Path2D();for(let i=0;i<10;i++){const r=i%2?26:58,t=-Math.PI/2+i*Math.PI/5;p[i?'lineTo':'moveTo'](65+Math.cos(t)*r,68+Math.sin(t)*r)}p.closePath();crayon(g,p,"#f6cf3c","#e09a1f",0,0,130,130,4)}),
  rock:mk(180,120,(g)=>{const p=blob(90,68,80,48,14,.22);crayon(g,p,"#c4c0b6","#7d756a",0,0,180,120,5,"#1b1b1f");g.strokeStyle="#6b6b6d";g.lineWidth=3;g.beginPath();g.moveTo(60,60);g.lineTo(85,48);g.moveTo(105,80);g.lineTo(125,70);g.stroke()}),
  hole:mk(220,90,(g)=>{const p=blob(110,45,104,38,18,.12);crayon(g,p,"#1b1c22","#3b3540",0,0,220,90,3,"#a0604a");const q=blob(110,50,80,26,14,.15);g.fillStyle="#0e0f13";g.fill(q)}),
  lamp:mk(90,420,(g)=>{g.fillStyle="#f6e7a1";g.globalAlpha=.25;g.beginPath();g.arc(45,40,42,0,7);g.fill();g.globalAlpha=1;
    const pole=new Path2D();pole.rect(39,60,12,355);crayon(g,pole,"#6c7286","#3c4050",30,60,30,360,3,"#1b1d26");
    const head=blob(45,42,22,18,10,.1);crayon(g,head,"#f6e7a1","#f2c94c",20,20,50,45,3,"#1b1d26")}),
};
const BUILD_COLORS=[["#8a6f9e","#5c4a6e"],["#5f7da0","#3d5574"],["#a0604a","#6e3e2f"],["#6e8f63","#46603e"],["#b08a4a","#7a5c2c"]];
const BUILDINGS=[0,1,2,3,4,5].map(v=>{const w=200+Math.floor(hr()*120),h=360+Math.floor(hr()*420);return mk(w,h,(g)=>{
  const [f,s]=BUILD_COLORS[v%5];const p=new Path2D();p.rect(4,14,w-8,h-16);crayon(g,p,f,s,0,0,w,h,4,"#14161d");
  const cols=Math.max(2,Math.floor((w-30)/46)),rows=Math.floor((h-60)/56);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=20+c*((w-40)/cols),y=40+r*56,lit=hr()<0.62;
    const q=new Path2D();q.rect(x,y,(w-40)/cols-14,32);crayon(g,q,lit?"#f8e07a":"#2a2d3a",lit?"#f2b84c":"#1c1e28",x,y,40,32,2,"#14161d")}
  if(v%2===0){g.fillStyle="#14161d";g.fillRect(w*0.4,4,w*0.2,12)}})});
const CITYLINE=mk(1400,300,(g,w,h)=>{let x=0;while(x<w){const bw=60+hr()*110,bh=80+hr()*200;const p=new Path2D();p.rect(x,h-bh,bw,bh);
  crayon(g,p,hr()<.5?"#2e3658":"#38406a","#1f2644",x,h-bh,bw,bh,2,"#161a30");
  for(let yy=h-bh+14;yy<h-14;yy+=22)for(let xx=x+10;xx<x+bw-14;xx+=18)if(hr()<0.35){g.fillStyle="#f8e07a";g.globalAlpha=.85;g.fillRect(xx,yy,8,10);g.globalAlpha=1}
  x+=bw+hr()*8}});

let segs=[],trackLen=0;
function lastY(){return segs.length?segs[segs.length-1].p2.world.y:0}
function addSeg(curve,y){const n=segs.length;
  segs.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}},
    curve,sprites:[],items:[],tufts:[[-(1.15+rnd()*2.5),rnd()],[1.15+rnd()*2.5,rnd()],[-(1.2+rnd()*4),rnd()],[1.2+rnd()*4,rnd()]],alt:Math.floor(n/RUMBLE)%2})}
function addRoad(e,h,l,curve,hill){const sy=lastY(),ey=sy+hill*SEG,tot=e+h+l;
  for(let i=0;i<e;i++)addSeg(ease(0,curve,i/e),ease(sy,ey,i/tot));
  for(let i=0;i<h;i++)addSeg(curve,ease(sy,ey,(e+i)/tot));
  for(let i=0;i<l;i++)addSeg(ease(curve,0,i/l),ease(sy,ey,(e+h+i)/tot))}
const R=(n,c,h)=>addRoad(n,n,n,c,h);
function closeLoop(){const y=lastY();addRoad(30,30,30,0,-y/SEG);trackLen=segs.length*SEG}
function side(n,k,o,hit=true){if(segs[n])segs[n].sprites.push({k,o,hit})}
function clearNear(n,r,sign){for(let k=n-r;k<n+r;k++)if(segs[k])segs[k].sprites=segs[k].sprites.filter(s=>Math.sign(s.o)!==sign)}
function addLetters(from,step){const w="STEM";let li=0;for(let n=from;n<segs.length-40;n+=step+Math.floor(rnd()*25)){segs[n].items.push({t:"letter",ch:w[li%4],o:(rnd()<0.5?-0.5:0.5)+(rnd()-0.5)*0.3});li++}}
function addStars(from,gap){for(let n=from;n<segs.length-30;n+=gap+Math.floor(rnd()*gap)){
  const lane=rnd()<0.5?-0.5:0.5,weave=rnd()<0.4;
  for(let i=0;i<5;i++){const s=segs[n+i*3];if(!s||s.items.length)continue;s.items.push({t:"star",o:weave?lane*Math.cos(i/4*Math.PI):lane})}}}
const TREES=["tree_big","pine","tree_left","tree_mid"];

function buildMeadow(){seed=7;
  R(25,0,0);R(40,0,20);R(50,3,0);R(30,0,-20);R(50,-4,10);R(25,0,0);R(40,5,-10);R(40,-2,25);R(30,0,-25);
  R(50,4,0);R(25,-5,15);R(40,0,-15);R(50,-3,0);R(30,2,20);R(40,0,-20);R(25,-4,0);R(30,0,0);closeLoop();
  for(let n=10;n<segs.length;n++){
    if(rnd()<0.55){const s=rnd()<0.5?-1:1;side(n,TREES[Math.floor(rnd()*4)],s*(1.25+rnd()*0.9))}
    if(n%3===0&&rnd()<0.6){const s=rnd()<0.5?-1:1;side(n,TREES[Math.floor(rnd()*4)],s*(2.6+rnd()*3))}}
  for(const n of [120,520,980,1450]){clearNear(n,25,-1);side(n,"lake",-1.5,false)}
  addLetters(60,38);addStars(40,45)}
function buildMountain(){seed=21;
  R(20,0,0);let sign=1;
  while(segs.length<1450){const n=16+Math.floor(rnd()*18),c=sign*(4+rnd()*2.6),h=(rnd()-0.5)*80;R(n,c,h);if(rnd()<0.3)R(10,0,(rnd()-0.5)*30);sign=-sign}
  closeLoop();
  for(let n=10;n<segs.length;n++){
    if(rnd()<0.6){const s=rnd()<0.5?-1:1;side(n,rnd()<0.7?"pine":TREES[Math.floor(rnd()*4)],s*(1.25+rnd()*1.2))}
    if(n%4===0&&rnd()<0.35){const s=rnd()<0.5?-1:1;side(n,"rock_side",s*(1.2+rnd()*0.6))}
    if(n%28===0){const s=segs[n].curve>0?-1:1;side(n,"mtn",s*(3+rnd()*2))}}
  for(const n of [300,900]){clearNear(n,25,-1);side(n,"lake",-1.5,false)}
  addLetters(70,45);addStars(30,30)}
function buildCity(){seed=33;
  R(20,0,0);
  while(segs.length<1500){const r=rnd();if(r<0.45)R(20+Math.floor(rnd()*20),0,0);else if(r<0.85)R(10+Math.floor(rnd()*12),(rnd()<0.5?-1:1)*(3+rnd()*2.5),0);else R(20,0,(rnd()-0.5)*30)}
  closeLoop();
  for(let n=0;n<segs.length;n++){
    if(n%5===0)side(n,"b"+Math.floor(rnd()*6),-(1.6+rnd()*0.5));
    if(n%5===2)side(n,"b"+Math.floor(rnd()*6),1.6+rnd()*0.5);
    if(n%12===0)side(n,"lamp",n%24?1.15:-1.15)}
  for(let n=70;n<segs.length-30;n+=22+Math.floor(rnd()*22)){const o=(rnd()<0.5?-0.5:0.5)+(rnd()-0.5)*0.3;segs[n].items.push({t:rnd()<0.55?"rock":"hole",o})}
  addLetters(55,50);addStars(35,32)}

// ---- levels
const LEVELS=[
 {name:"Meadow road",theme:"meadow",laps:2,speed:1,build:buildMeadow,
  rivals:[{k:"blue",pace:0.86,x:-0.5,start:5,name:"Blue car"}],
  tip:"Beat the blue car!",text:"Race the blue car for 2 laps. Stars are 10 points. S T E M letters give you a turbo."},
 {name:"Mountain road",theme:"mountain",laps:2,speed:1.35,build:buildMountain,
  rivals:[{k:"blue",pace:0.85,x:-0.5,start:5,name:"Blue car"},{k:"red",pace:0.88,x:0.5,start:10,name:"Red car"}],
  tip:"Two cars, sharp curves, more speed!",text:"A fast road full of curves. Beat the blue car and the red car. Slow down in the sharp bends!"},
 {name:"City at night",theme:"night",laps:2,speed:1.45,build:buildCity,lives:3,
  rivals:[{k:"blue",pace:0.85,x:-0.5,start:5,name:"Blue car"},{k:"red",pace:0.87,x:0.5,start:10,name:"Red car"}],

];

// ---- game state
let L=0,lv=LEVELS[0],th=THEMES.meadow;
let got=[false,false,false,false];const LC=[C.red,"#3a6db3",C.dark,C.orange];
let pos=0,playerX=0.45,speed=0,state="intro",raceT=0,cd=0,pTotal=0,boost=0,shake=0,skyOff=0,flash=null,steer=0,lapShown=1,finT=0,playerFin=null,place=1;
let score=0,levelStartScore=0,totalTime=0,lives=3,invuln=0,stars=0;
let rivals=[];
const keys={left:false,right:false,up:false,down:false};
const fmt=t=>t==null?"–":(Math.floor(t/60)+":"+(t%60).toFixed(1).padStart(4,"0"));

function loadLevel(i){L=i;lv=LEVELS[i];th=THEMES[lv.theme];segs=[];lv.build();setSpeed(lv.speed);
  document.querySelectorAll('#levels span[data-l]').forEach(b=>{b.classList.toggle('cur',+b.dataset.l===i);b.classList.toggle('done',+b.dataset.l<i)});
  resetRace()}
function resetRace(){raceT=0;pTotal=0;pos=0;playerX=0.45;speed=0;boost=0;lapShown=1;playerFin=null;got=[false,false,false,false];invuln=0;shake=0;steer=0;
  lives=lv.lives||0;stars=0;place=lv.rivals.length+1;
  rivals=lv.rivals.map(r=>({...r,total:SEG*r.start,tx:r.x,speed:0,laneT:3+Math.random()*3,fin:null}));
  for(const s of segs)for(const it of s.items)it.taken=false}

function project(p,cx,cy,cz){p.camera.x=-cx;p.camera.y=(p.world.y||0)-cy;p.camera.z=p.world.z-cz;
  p.screen.scale=CAMD/p.camera.z;p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);
  p.screen.y=Math.round(H/2-p.screen.scale*p.camera.y*H/2);p.screen.w=Math.round(p.screen.scale*ROADW*W/2)}
function quad(x1,y1,w1,x2,y2,w2,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x2-w2,y2);ctx.lineTo(x2+w2,y2);ctx.lineTo(x1+w1,y1);ctx.closePath();ctx.fill()}
function line(x1,y1,x2,y2,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

function drawSeg(s){const a=s.p1.screen,b=s.p2.screen;
  ctx.fillStyle=s.alt?th.grass:th.grass2;ctx.fillRect(0,b.y,W,a.y-b.y+1);
  if(th.side)quad(a.x,a.y,a.w*1.22,b.x,b.y,b.w*1.22,th.side);
  quad(a.x,a.y,a.w*1.03,b.x,b.y,b.w*1.03,th.edge);
  quad(a.x,a.y,a.w,b.x,b.y,b.w,s.alt?th.road:th.road2);
  const lw=Math.max(1,a.w*0.006);
  line(a.x-a.w,a.y,b.x-b.w,b.y,th.line,lw);line(a.x+a.w,a.y,b.x+b.w,b.y,th.line,lw);
  const k=s.index%(RUMBLE*2);
  if(k<RUMBLE){const da=a.w*0.07,db=b.w*0.07,dl=Math.max(1,a.w*0.008);
    line(a.x-da,a.y,b.x-db,b.y,th.line,dl);line(a.x+da,a.y,b.x+db,b.y,th.line,dl);
    if(k===0)line(a.x-da,a.y,a.x+da,a.y,th.line,dl);if(k===RUMBLE-1)line(b.x-db,b.y,b.x+db,b.y,th.line,dl)}
  if(s.index===START_SEG){const n=10;for(let r=0;r<2;r++)for(let i=0;i<n;i++){if((i+r)%2)continue;
    const t0=i/n*2-1,t1=(i+1)/n*2-1,f0=r/2,f1=(r+1)/2;
    const X=(t,f)=>a.x+(b.x-a.x)*f+t*(a.w+(b.w-a.w)*f),Y=f=>a.y+(b.y-a.y)*f;
    ctx.fillStyle=th.line;ctx.beginPath();ctx.moveTo(X(t0,f0),Y(f0));ctx.lineTo(X(t1,f0),Y(f0));ctx.lineTo(X(t1,f1),Y(f1));ctx.lineTo(X(t0,f1),Y(f1));ctx.fill()}}
  if(th.tuft&&a.w>6)for(const [o,r] of s.tufts){const x=a.x+o*a.w,sz=a.w*0.05;if(x<-sz||x>W+sz)continue;
    ctx.strokeStyle=r<0.6?th.tuft[0]:(r<0.85?th.tuft[1]:th.tuft[2]);ctx.lineWidth=Math.max(1,sz*0.18);ctx.beginPath();
    for(let j=-1;j<=1;j++){ctx.moveTo(x+j*sz*0.4,a.y);ctx.lineTo(x+j*sz*0.7+sz*0.2,a.y-sz*(1+r*0.6))}ctx.stroke()}
}
function drawSprite(s,sp){const i=sp.k==="mtn"?img.mountains:pic(sp.k);if(!i||(i.complete===false))return;const sc=s.p1.screen.scale;
  const dh=SPR[sp.k]*sc*W/2,dw=dh*i.width/i.height;let x=s.p1.screen.x+sc*sp.o*ROADW*W/2,y=s.p1.screen.y;
  x+= sp.o<0?-dw:0;y-=dh;const clipH=s.clip?Math.max(0,y+dh-s.clip):0;if(clipH>=dh)return;
  ctx.drawImage(i,0,0,i.width,i.height-i.height*clipH/dh,x,y,dw,dh-clipH)}
const ITEM_W={star:300,rock:560,hole:700};
function drawItem(s,it){const sc=s.p1.screen.scale;const x=s.p1.screen.x+sc*it.o*ROADW*W/2,y=s.p1.screen.y;if(s.clip&&y>s.clip+2)return;
  if(it.t==="letter")return drawLetter(s,it,x,y,sc);
  const p=PIECE[it.t],dw=ITEM_W[it.t]*sc*W/2;if(dw<2)return;const dh=dw*p.height/p.width;
  if(it.t==="star"){const bob=Math.sin(perfT*0.005+s.index)*dh*0.08;ctx.fillStyle="rgba(60,60,60,.15)";ctx.beginPath();ctx.ellipse(x,y,dw*0.35,dw*0.06,0,0,7);ctx.fill();
    ctx.drawImage(p,x-dw/2,y-dh*1.35+bob,dw,dh)}
  else if(it.t==="hole")ctx.drawImage(p,x-dw/2,y-dh*0.8,dw,dh);
  else ctx.drawImage(p,x-dw/2,y-dh*0.92,dw,dh)}
function drawLetter(s,Lt,x,y0,sc){const r=380*sc*W/2;if(r<2)return;
  const y=y0-r*1.15-Math.sin(perfT*0.004+s.index)*r*0.12;
  const col=LC["STEM".indexOf(Lt.ch)];
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="rgba(60,60,60,.15)";ctx.beginPath();ctx.ellipse(0,r*1.15,r*0.7,r*0.15,0,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();for(let a=0;a<=12;a++){const t=a/12*Math.PI*2,rr=r*(1+Math.sin(a*2.3+s.index)*0.04);ctx[a?'lineTo':'moveTo'](Math.cos(t)*rr,Math.sin(t)*rr)}ctx.fill();
  ctx.strokeStyle=C.pencil;ctx.lineWidth=Math.max(1,r*0.07);ctx.stroke();
  ctx.fillStyle="#fff";ctx.font=`${Math.round(r*1.35)}px "Patrick Hand", cursive`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(Lt.ch,0,r*0.08);
  ctx.restore()}

const NIGHTSTARS=Array.from({length:60},()=>[Math.random(),Math.random()*0.45,Math.random()]);
function drawSky(){const base=H/2+6;
  if(th.night){const g=ctx.createLinearGradient(0,0,0,base);g.addColorStop(0,th.sky);g.addColorStop(1,th.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,base);
    ctx.fillStyle="#f6f1d5";for(const [x,y,r] of NIGHTSTARS){ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(perfT*0.001+r*9));ctx.fillRect(x*W,y*H,2+r*2,2+r*2)}ctx.globalAlpha=1;
    const mx=W*0.8-((skyOff*W*0.2)%W+W)%W*0.1;ctx.fillStyle="#f6e7a1";ctx.beginPath();ctx.arc(mx,H*0.13,34,0,7);ctx.fill();ctx.fillStyle=th.sky;ctx.beginPath();ctx.arc(mx+14,H*0.12,30,0,7);ctx.fill()}
  else{ctx.fillStyle=th.sky;ctx.fillRect(0,0,W,base)}
  const m=th.back==="city"?CITYLINE:img.mountains;
  if(m&&m.complete!==false){const mw=W*th.backW,mh=mw*m.height/m.width;
    let off=((skyOff*W*0.6)%(mw*2)+mw*2)%(mw*2);
    for(let x=-off;x<W;x+=mw*2){ctx.drawImage(m,x,base-mh,mw,mh);ctx.save();ctx.translate(x+mw*2,0);ctx.scale(-1,1);ctx.drawImage(m,0,base-mh,mw,mh);ctx.restore()}}
  ctx.fillStyle=th.grass;ctx.fillRect(0,base-2,W,H-base)}

let perfT=0;
const rivalZ=r=>((PLAYERZ+r.total)%trackLen+trackLen)%trackLen;
function drawRival(s,r,rp){const c=img[r.k];if(!c.complete)return;
  const a=s.p1.screen,b=s.p2.screen,sc=a.scale+(b.scale-a.scale)*rp;
  const sx=a.x+(b.x-a.x)*rp,sy=a.y+(b.y-a.y)*rp;const dw=CAR_WORLD*sc*W/2,dh=dw*c.height/c.width;if(dw<3)return;
  const x=sx+sc*r.x*ROADW*W/2-dw/2,y=sy-dh;const clipH=s.clip?Math.max(0,sy-s.clip):0;if(clipH>=dh)return;
  ctx.fillStyle="rgba(20,20,20,.22)";ctx.beginPath();ctx.ellipse(x+dw/2,sy-dh*0.02,dw*0.48,dh*0.04,0,0,7);ctx.fill();
  ctx.drawImage(c,0,0,c.width,c.height-c.height*clipH/dh,x,y,dw,dh-clipH);
  if(th.night){ctx.fillStyle="rgba(255,70,50,.35)";for(const f of[0.2,0.8]){ctx.beginPath();ctx.arc(x+dw*f,y+dh*0.4,dw*0.09,0,7);ctx.fill()}}}
function render(){
  const base=segs[Math.floor(pos/SEG)%segs.length],bp=(pos%SEG)/SEG,ps=findSeg(pos+PLAYERZ),pp=((pos+PLAYERZ)%SEG)/SEG;
  const py=ps.p1.world.y+(ps.p2.world.y-ps.p1.world.y)*pp;
  ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*10);
  drawSky();
  let maxy=H,x=0,dx=-(base.curve*bp);
  for(let n=0;n<DRAW;n++){const s=segs[(base.index+n)%segs.length];const looped=s.index<base.index;
    s.clip=maxy;
    project(s.p1,playerX*ROADW-x,py+CAMH,pos-(looped?trackLen:0));
    project(s.p2,playerX*ROADW-x-dx,py+CAMH,pos-(looped?trackLen:0));
    x+=dx;dx+=s.curve;
    if(s.p1.camera.z<=CAMD||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy)continue;
    drawSeg(s);maxy=s.p1.screen.y}
  const ahead={},behind=[];
  for(const r of rivals){const z=rivalZ(r),rs=findSeg(z),rn=(rs.index-base.index+segs.length)%segs.length;if(rn<1||rn>=DRAW)continue;
    const e={r,rp:(z%SEG)/SEG,s:rs};if(r.total>=pTotal)(ahead[rn]=ahead[rn]||[]).push(e);else behind.push([rn,e])}
  for(let n=DRAW-1;n>0;n--){const s=segs[(base.index+n)%segs.length];if(s.p1.camera.z<=CAMD)continue;
    for(const sp of s.sprites)drawSprite(s,sp);for(const it of s.items)if(!it.taken)drawItem(s,it);
    if(ahead[n])for(const e of ahead[n])drawRival(s,e.r,e.rp)}
  if(th.night)drawBeams();
  drawPlayer();
  behind.sort((a,b)=>b[0]-a[0]);for(const [,e] of behind)if(e.s.p1.camera.z>CAMD)drawRival(e.s,e.r,e.rp);
  ctx.restore();drawHud()}
function drawBeams(){ctx.save();ctx.globalCompositeOperation="lighter";const g=ctx.createLinearGradient(0,H*0.55,0,H-150);g.addColorStop(0,"rgba(246,231,161,0)");g.addColorStop(1,"rgba(246,231,161,.22)");
  ctx.fillStyle=g;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(W/2+sx*70,H-150);ctx.lineTo(W/2+sx*20-steer*30,H*0.55);ctx.lineTo(W/2+sx*200-steer*30,H*0.55);ctx.lineTo(W/2+sx*110,H-150);ctx.fill()}ctx.restore()}
function drawPlayer(){const c=img.car;if(!c.complete)return;const w=CAR_W,h=w*c.height/c.width;
  const off=Math.abs(playerX)>1&&speed>10;const bounce=(speed>0?Math.sin(perfT*0.03)*(off?3:0.8):0);
  ctx.save();ctx.translate(W/2,H-18+bounce);ctx.rotate(steer*0.05);
  if(invuln>0&&Math.floor(perfT/90)%2)ctx.globalAlpha=0.45;
  ctx.fillStyle="rgba(20,20,20,.22)";ctx.beginPath();ctx.ellipse(0,-6,w*0.48,12,0,0,7);ctx.fill();
  if(boost>0){ctx.strokeStyle=C.orange;ctx.lineWidth=3;for(let i=0;i<5;i++){const xx=(i-2)*w*0.2,len=20+Math.random()*30;ctx.beginPath();ctx.moveTo(xx,6);ctx.lineTo(xx+(Math.random()-0.5)*6,6+len);ctx.stroke()}}
  ctx.drawImage(c,-w/2,-h,w,h);
  if((keys.down&&speed>0)||th.night){ctx.fillStyle=keys.down?"rgba(255,60,40,.45)":"rgba(255,60,40,.28)";for(const sx of[-0.3,0.3]){ctx.beginPath();ctx.arc(sx*w*1.07,-h*0.59,w*0.085,0,7);ctx.fill()}}
  ctx.restore()}

const ORD=["1st","2nd","3rd"];
function drawHud(){ctx.save();ctx.textBaseline="top";
  const box=(x,y,w,txt,col,fs=28)=>{ctx.font=fs+'px "Patrick Hand", cursive';ctx.fillStyle="rgba(251,251,247,.92)";ctx.strokeStyle=C.pencil;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,38,10);ctx.fill();ctx.stroke();ctx.fillStyle=col||C.pencil;ctx.textAlign="center";ctx.fillText(txt,x+w/2,y+5)};
  const lap=Math.min(lv.laps,Math.floor(pTotal/trackLen)+1);
  box(12,12,118,"Lap "+lap+"/"+lv.laps);
  box(W/2-80,12,160,"⏱ "+fmt(playerFin??raceT));
  box(W-130,12,118,ORD[place-1]||"",place===1?C.dark:"#3a6db3",30);
  // second row: letters, score, lives
  const wx=12;ctx.fillStyle="rgba(251,251,247,.92)";ctx.strokeStyle=C.pencil;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(wx,56,150,38,10);ctx.fill();ctx.stroke();
  ctx.font='28px "Patrick Hand", cursive';"STEM".split("").forEach((ch,i)=>{ctx.fillStyle=got[i]?LC[i]:"#c9ccc2";ctx.textAlign="center";ctx.fillText(ch,wx+24+i*34,60)});
  box(W/2-80,56,160,"★ "+score,"#b7791f");
  if(lv.lives){ctx.fillStyle="rgba(251,251,247,.92)";ctx.strokeStyle=C.pencil;ctx.beginPath();ctx.roundRect(W-130,56,118,38,10);ctx.fill();ctx.stroke();
    for(let i=0;i<3;i++)drawHeart(W-106+i*35,75,13,i<lives)}
  ctx.font='24px "Patrick Hand", cursive';ctx.textAlign="right";ctx.fillStyle=th.night?"#ecebe0":C.pencil;ctx.fillText(Math.round(speed/BASES*160)+" km/h",W-16,H-40);
  if(state==="play"){const ah=rivals.filter(r=>r.total>pTotal).sort((a,b)=>a.total-b.total)[0];ctx.textAlign="center";ctx.font='22px "Patrick Hand", cursive';
    ctx.fillStyle=th.night?"#f6e7a1":"#3a6db3";
    if(ah){const g=Math.round((ah.total-pTotal)/SEG*4);ctx.fillText(ah.name+" is "+g+" m ahead",W/2,102)}else ctx.fillText("You are in the lead!",W/2,102)}
  if(state==="between"){ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="rgba(251,251,247,.92)";ctx.strokeStyle=C.pencil;ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(24,H*0.22,W-48,190,18);ctx.fill();ctx.stroke();
    ctx.fillStyle=C.dark;ctx.font='28px "Patrick Hand", cursive';ctx.fillText("Level "+L+" done! +100 ★",W/2,H*0.22+36);
    ctx.fillStyle=C.pencil;ctx.font='46px "Patrick Hand", cursive';ctx.fillText("Level "+(L+1)+": "+lv.name,W/2,H*0.22+95,W-80);
    ctx.fillStyle="#69705f";ctx.font='24px "Patrick Hand", cursive';ctx.fillText(lv.tip,W/2,H*0.22+152)}
  if(state==="count"){const n=Math.ceil(cd);ctx.font='120px "Patrick Hand", cursive';ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=10;ctx.strokeStyle="#fff";const t=n>0?String(n):"GO!";ctx.fillStyle=n>0?C.red:C.dark;ctx.strokeText(t,W/2,H*0.32);ctx.fillText(t,W/2,H*0.32)}
  if(flash&&flash.t>0){ctx.globalAlpha=Math.min(1,flash.t*2);ctx.font='44px "Patrick Hand", cursive';ctx.textAlign="center";ctx.textBaseline="top";ctx.fillStyle=flash.c;
    ctx.strokeStyle="#fff";ctx.lineWidth=6;const fy=H*0.3-(1-flash.t)*30;ctx.strokeText(flash.s,W/2,fy);ctx.fillText(flash.s,W/2,fy)}
  ctx.restore()}
function drawHeart(x,y,r,full){ctx.beginPath();ctx.moveTo(x,y+r*0.9);ctx.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.6,y-r*1.3,x,y-r*0.35);ctx.bezierCurveTo(x+r*0.6,y-r*1.3,x+r*1.6,y-r*0.2,x,y+r*0.9);
  ctx.fillStyle=full?C.red:"#e2e2dc";ctx.fill();ctx.strokeStyle=C.pencil;ctx.lineWidth=2;ctx.stroke()}

function overlap(x1,w1,x2,w2){const a=x1-w1/2,b=x1+w1/2,c=x2-w2/2,d=x2+w2/2;return !(b<c||a>d)}
function say(s,c){flash={s,c:c||C.dark,t:1}}
const findSeg=z=>segs[Math.floor(z/SEG)%segs.length];
function move(d){pos+=d;pTotal+=d;while(pos>=trackLen){pos-=trackLen;for(const s of segs)for(const it of s.items)it.taken=false}while(pos<0)pos+=trackLen}

function updateRivals(dt){if(state!=="play"&&state!=="finished")return;
  for(const r of rivals){const rs=findSeg(rivalZ(r));
    let target=MAXS*r.pace*(1-Math.min(0.25,Math.abs(rs.curve)*0.03));
    const gap=r.total-pTotal;
    if(state==="play"){if(gap>SEG*14)target*=0.9;else if(gap<-SEG*12)target*=1.16}
    r.speed=Math.min(target,r.speed+ACC*0.85*dt);if(r.speed>target)r.speed=Math.max(target,r.speed+DECEL*dt);
    r.laneT-=dt;if(r.laneT<=0){r.laneT=3+Math.random()*4;const nt=r.tx>0?-0.5:0.5;if(!(Math.abs(gap)<SEG*5&&overlap(nt,PLAYER_W,playerX,PLAYER_W)))r.tx=nt}
    if(gap<0&&gap>-SEG*5&&overlap(r.x,PLAYER_W,playerX,PLAYER_W))r.tx=playerX>0?-0.55:0.55;
    // keep clear of each other
    for(const o of rivals)if(o!==r&&Math.abs(o.total-r.total)<SEG*3&&Math.abs(o.tx-r.tx)<0.3&&o.total>r.total)r.tx=o.tx>0?-0.5:0.5;
    r.x+=(r.tx-r.x)*Math.min(1,dt*1.5);
    r.total+=r.speed*dt;
    if(r.fin==null&&r.total>=lv.laps*trackLen){r.fin=raceT;if(state==="play")say(r.name+" finished!","#3a6db3")}}}

function hitPlayer(kind){
  if(kind==="rock"){if(invuln>0)return;lives--;invuln=1.6;speed=MAXS/8;boost=0;shake=1.1;
    if(lives<=0){lives=0;state="crashed";finT=1.2;say("Out of lives!",C.red)}else say("Ouch! −1 ♥",C.red)}
  else{speed=Math.min(speed,MAXS*0.32);shake=0.8;boost=0;say("Bump! A hole!",C.brown)}}

function update(dt){perfT+=dt*1000;
  if(flash)flash.t-=dt*0.8;if(shake>0)shake=Math.max(0,shake-dt*3);if(boost>0)boost-=dt;if(invuln>0)invuln-=dt;
  if(state==="between"){bt-=dt;if(bt<=0){state="count";cd=2.2}}
  if(state==="count"){cd-=dt;if(cd<=0){state="play";say("GO!",C.dark)}}
  if(state==="play"||state==="finished")raceT+=dt;
  const ps=findSeg(pos+PLAYERZ),sp=speed/MAXS,dx=dt*2.2*sp;
  const playing=state==="play";
  const Lk=playing&&keys.left,Rk=playing&&keys.right,U=playing&&keys.up,D=playing&&keys.down;
  steer+=((Lk?-1:Rk?1:0)-steer)*Math.min(1,dt*8);
  if(Lk)playerX-=dx;else if(Rk)playerX+=dx;
  playerX-=dx*sp*ps.curve*CENTRI;
  const top=boost>0?MAXS*1.25:MAXS;
  if(U||(boost>0&&playing))speed+=(boost>0?ACC*1.8:ACC)*dt;else if(D)speed+=BRAKE*dt;else speed+=DECEL*(playing?1:2)*dt;
  if(speed>top)speed=Math.max(top,speed+DECEL*2*dt);
  if(Math.abs(playerX)>1&&speed>OFFLIM)speed+=OFFDEC*dt;
  if(Math.abs(playerX)>1)for(const s of ps.sprites){if(!s.hit)continue;const i=s.k==="mtn"?img.mountains:pic(s.k);const ww=SPR[s.k]*i.width/i.height/ROADW;
    const cx=s.o<0?s.o-ww/2:s.o+ww/2;if(overlap(playerX,PLAYER_W,cx,ww*COL[s.k])){speed=MAXS/12;boost=0;move(-SEG*0.6);shake=1;playerX+=playerX<cx?-0.08:0.08;say("Bonk!",C.brown);break}}
  if(playing)for(const seg of [ps,findSeg(pos+PLAYERZ+SEG)])for(const it of seg.items){if(it.taken)continue;
    if(it.t==="star"&&overlap(playerX,PLAYER_W,it.o,0.35)){it.taken=true;score+=10;stars++;say("+10 ★","#b7791f")}
    else if(it.t==="letter"&&overlap(playerX,PLAYER_W,it.o,0.45)){it.taken=true;const gi="STEM".indexOf(it.ch);boost=Math.max(boost,1.2);
      if(!got[gi]){got[gi]=true;if(got.every(Boolean)){got=[false,false,false,false];boost=3.5;say("STEM turbo!",C.orange)}else say(it.ch+" turbo!",LC[gi])}else say("Turbo!",LC[gi])}
    else if((it.t==="rock"||it.t==="hole")&&overlap(playerX,PLAYER_W*0.85,it.o,0.4)){it.taken=it.t==="rock";if(it.t==="hole"){if(it.cool>perfT)continue;it.cool=perfT+1500}hitPlayer(it.t)}}
  if(playing)for(const r of rivals){const gap=r.total-pTotal;
    if(Math.abs(gap)<SEG*1.1&&overlap(playerX,PLAYER_W,r.x,PLAYER_W*0.9)){
      if(gap>0&&speed>r.speed){speed=r.speed*0.8;boost=0;shake=0.6;say("Bump!","#3a6db3")}
      else if(gap<=0&&r.speed>speed){r.speed=speed*0.8;shake=0.4}
      playerX+=playerX>r.x?dt*1.5:-dt*1.5}}
  playerX=Math.max(-3,Math.min(3,playerX));speed=Math.max(0,speed);
  move(dt*speed);
  updateRivals(dt);
  if(playing)place=1+rivals.filter(r=>r.total>pTotal).length;
  skyOff+=dt*sp*ps.curve*0.02;
  if(playing){const lap=Math.floor(pTotal/trackLen)+1;if(lap>lapShown&&lap<=lv.laps){lapShown=lap;say("Final lap!",C.red)}
    if(pTotal>=lv.laps*trackLen){playerFin=raceT;place=1+rivals.filter(r=>r.fin!=null).length;state="finished";finT=place===1&&L<LEVELS.length-1?1.0:1.4;say(place===1?"1st place!":ORD[place-1]+" place",place===1?C.dark:"#3a6db3")}}
  if(state==="finished"||state==="crashed"){finT-=dt;if(finT<=0)showResult()}
}

// ---- screens
const ov=document.getElementById('ov'),ovL=document.getElementById('ovLvl'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovK=document.getElementById('ovKeys'),goBtn=document.getElementById('goBtn');
let next=null,bt=0;
function screen(lvl,title,html,btn,action,win=false){ovL.textContent=lvl;ovT.textContent=title;ovT.className=win?"win":"";ovX.innerHTML=html;goBtn.textContent=btn;next=action;ovK.hidden=btn!=="Start race";ov.hidden=false;try{goBtn.focus({preventScroll:true})}catch(e){}}
function intro(i){loadLevel(i);state="intro";
  screen("LEVEL "+(i+1)+" OF 3",lv.name,lv.text+(lv.lives?"<br><br>You have ❤️❤️❤️":""),"Start race",startRace)}
function startRace(){resetRace();levelStartScore=score;state="count";cd=3.2;ov.hidden=true;cv.focus({preventScroll:true})}
function showResult(){state="over";
  if(lives<=0&&lv.lives){score=levelStartScore;screen("LEVEL "+(L+1),"Out of lives!","Three rocks got you. Try again: steer around the rocks and holes.","Try again",startRace);return}
  if(place===1){const bonus=100;score+=bonus;totalTime+=playerFin;
    if(L===LEVELS.length-1){let best=0;try{best=+localStorage.getItem('stemTripBest')||0}catch(e){}const rec=score>best;if(rec)try{localStorage.setItem('stemTripBest',score)}catch(e){}
      screen("ALL 3 LEVELS DONE","You win!",`<span class="big">★ ${score}</span><br>points · total time ${fmt(totalTime)}${rec?"<br>New best score!":""}`,"Play again",()=>{score=0;totalTime=0;intro(0)},true)}
    else{loadLevel(L+1);levelStartScore=score;state="between";bt=2.2}}
  else{score=levelStartScore;screen("LEVEL "+(L+1),"You came "+ORD[place-1],`You need 1st place to go on. Time ${fmt(playerFin)}. Grab the S T E M letters for turbo!`,"Try again",startRace)}}
goBtn.onclick=()=>next&&next();

const KM={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){keys[k]=true;e.preventDefault()}},{passive:false});
addEventListener('keyup',e=>{const k=KM[e.key];if(k){keys[k]=false;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',e=>e.preventDefault())});

intro(0);
let last=performance.now();
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>

</body></html>
