<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STEM Road Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#10202e;--panel:rgba(14,28,40,.55);--ink:#ffffff;--accent:#ffd34d;--go:#3fbf5f;--stop:#e5533d;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#24455f 0%,var(--bg) 70%);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
[hidden]{display:none!important}
.app{min-height:100%;display:flex;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.frame{position:relative;width:var(--fw,min(100%,480px));max-width:100%;aspect-ratio:3/4;flex:none;border-radius:22px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(180deg,rgba(10,30,50,.25),rgba(10,30,50,.65))}
.menu h1{margin:0;font-size:clamp(2.6rem,9vw,4rem);font-weight:700;letter-spacing:.02em;line-height:1;
  text-shadow:0 4px 0 #c78a12,0 10px 24px rgba(0,0,0,.35);color:var(--accent)}
.menu p{margin:0;font-size:1.1rem;max-width:30ch;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.menu .score{font-size:2.4rem;font-weight:700;color:var(--accent)}
.btn{font-family:var(--font);font-weight:600;font-size:1.35rem;border:0;border-radius:999px;padding:12px 34px;cursor:pointer;color:#10301a;
  background:linear-gradient(180deg,#7ff09a,#36b956);box-shadow:0 6px 0 #1f7a36,0 12px 24px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #1f7a36}
.btn:focus-visible,.pad button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.keys{display:flex;gap:6px;align-items:center;font-size:.95rem;opacity:.95}
kbd{font-family:var(--font);background:rgba(255,255,255,.92);color:#123;border-radius:6px;padding:1px 8px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pad{width:var(--fw,100%);max-width:100%;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.1fr;gap:10px;user-select:none;-webkit-user-select:none}
.pad button{font-family:var(--font);font-size:1.7rem;font-weight:700;border:0;border-radius:16px;padding:14px 0;color:#fff;touch-action:none;cursor:pointer;
  background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.pad button.on{background:rgba(255,255,255,.32)}
.pad .gas{background:linear-gradient(180deg,#5fd67b,#2f9e4c)}
.pad .brk{background:linear-gradient(180deg,#f07a63,#c23d2a)}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
<div class="app">
  <div class="frame">
    <canvas id="game" tabindex="0" aria-label="STEM Road driving game. Use the arrow keys to drive."></canvas>
    <div class="menu" id="menu">
      <h1>STEM Road</h1>
      <p id="menuText">Drive your car down the endless road. Collect gold coins, stay on the road and don't hit the trees!</p>
      <div class="keys"><kbd>↑</kbd> drive <kbd>↓</kbd> brake <kbd>←</kbd><kbd>→</kbd> steer</div>
      <button class="btn" id="play" type="button">Play</button>
    </div>
  </div>
  <div class="pad" aria-label="Touch controls">
    <button type="button" data-k="left" aria-label="Steer left">◀</button>
    <button type="button" data-k="right" aria-label="Steer right">▶</button>
    <button type="button" class="brk" data-k="down" aria-label="Brake">▼</button>
    <button type="button" class="gas" data-k="up" aria-label="Drive">▲</button>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  STEM Road — a modern 2D take on a child's crayon drawing.
//  Layout kept from the drawing: road from the bottom centre that bends
//  right into the distance, lake on the left, mountains behind, trees
//  lining both sides, grey car with a STEM plate in the right lane.
// =====================================================================
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=600,H=800,HORIZON=H*0.42;
let DPR=1;
function resize(){DPR=Math.min(1.5,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);fit()}
// size the game so the whole screen (and the touch pad on phones) always fits
function fit(){const app=document.querySelector('.app'),pad=document.querySelector('.pad');
  const padH=pad&&getComputedStyle(pad).display!=="none"?pad.offsetHeight+10:0;
  const availH=Math.max(320,window.innerHeight-padH-28),availW=Math.max(260,app.clientWidth-24);
  const fw=Math.floor(Math.min(availW,availH*0.75,640));document.documentElement.style.setProperty('--fw',fw+'px')}
addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();addEventListener('resize',resize);

// ---------- helpers
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>`rgb(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0})`;
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);return c}

// ---------- palette (colours of the drawing, cleaned up)
const P={skyTop:"#5aa9f0",skyMid:"#9fd0f7",skyLow:"#dff1fb",haze:hex("#d9ecef"),
  grassA:hex("#9dd559"),grassB:hex("#97d054"),road:hex("#8e939a"),road2:hex("#8b9097"),line:hex("#f7f7f2"),verge:hex("#dfe874"),
  lime:"#a6d843",green:"#72b533",dark:"#4a8a2b",trunk:"#8b5a3c",trunkD:"#5f3a26",lake1:"#8cc4f5",lake2:"#4a8fdc"};

// ---------- pre-rendered sprites ---------------------------------------
// Every roadside piece is drawn once onto its own canvas, with light from the
// upper left and a soft shadow falling to the right.
function shadow(g,cx,cy,rx,ry,a=.28){const gr=g.createRadialGradient(cx,cy,0,cx,cy,rx);gr.addColorStop(0,`rgba(20,40,10,${a})`);gr.addColorStop(1,"rgba(20,40,10,0)");
  g.save();g.translate(cx,cy);g.scale(1,ry/rx);g.translate(-cx,-cy);g.fillStyle=gr;g.beginPath();g.arc(cx,cy,rx,0,7);g.fill();g.restore()}
function ball(g,x,y,r,base,light,darkc){const gr=g.createRadialGradient(x-r*.45,y-r*.5,r*.1,x,y,r*1.05);gr.addColorStop(0,light);gr.addColorStop(.55,base);gr.addColorStop(1,darkc);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function trunk(g,x,yTop,yBot,wTop,wBot){const gr=g.createLinearGradient(x-wBot,0,x+wBot,0);gr.addColorStop(0,"#a7744f");gr.addColorStop(.45,P.trunk);gr.addColorStop(1,P.trunkD);
  g.fillStyle=gr;g.beginPath();g.moveTo(x-wTop,yTop);g.lineTo(x+wTop,yTop);g.quadraticCurveTo(x+wBot*.8,(yTop+yBot)/2,x+wBot,yBot);g.lineTo(x-wBot,yBot);g.quadraticCurveTo(x-wBot*.8,(yTop+yBot)/2,x-wTop,yTop);g.fill()}
function makeTree(v){seed=100+v*17;const w=300,h=520;return mk(w,h,(g)=>{
  shadow(g,w/2+40,h-14,110,22,.35);
  const cx=w/2,base=h-16,tTop=h*0.42;trunk(g,cx,tTop,base,9,20);
  // branches into the crown, like the drawing
  g.strokeStyle=P.trunk;g.lineWidth=7;g.lineCap="round";g.beginPath();g.moveTo(cx,tTop+40);g.lineTo(cx-48,tTop-20);g.moveTo(cx,tTop+20);g.lineTo(cx+52,tTop-34);g.stroke();
  const pal=[[P.lime,"#d6f37a","#5f9a25"],[P.green,"#b5e36a","#3f7d22"],["#8cc63b","#c9ef72","#4e8a28"]][v%3];
  const blobs=[];for(let i=0;i<16;i++){const a=rnd()*Math.PI*2,r=rnd();blobs.push([cx+Math.cos(a)*r*95,tTop-70+Math.sin(a)*r*95*0.85,42+rnd()*30])}
  blobs.sort((a,b)=>a[1]-b[1]);
  // dark back layer then lit front layer
  for(const[x,y,r]of blobs)ball(g,x+6,y+8,r,pal[2],pal[2],"#2f5e1a");
  for(const[x,y,r]of blobs)ball(g,x,y,r*0.9,pal[0],pal[1],pal[2]);
  g.globalAlpha=.25;g.fillStyle="#fff";for(let i=0;i<10;i++){g.beginPath();g.arc(cx-60+rnd()*80,tTop-150+rnd()*90,3+rnd()*5,0,7);g.fill()}g.globalAlpha=1})}
function makePine(v){seed=300+v*7;const w=220,h=480;return mk(w,h,(g)=>{
  shadow(g,w/2+34,h-12,80,18,.35);const cx=w/2;trunk(g,cx,h-130,h-14,8,13);
  const layers=5;for(let i=0;i<layers;i++){const t=i/(layers-1),y=60+t*270,hw=34+t*70,hh=110;
    const gr=g.createLinearGradient(cx-hw,0,cx+hw,0);gr.addColorStop(0,"#7ccc45");gr.addColorStop(.5,"#4f9e32");gr.addColorStop(1,"#2f6d22");
    g.fillStyle=gr;g.beginPath();g.moveTo(cx,y-hh*0.55);g.quadraticCurveTo(cx+hw*.4,y,cx+hw,y+hh*.45);g.quadraticCurveTo(cx,y+hh*.32,cx-hw,y+hh*.45);g.quadraticCurveTo(cx-hw*.4,y,cx,y-hh*.55);g.fill();
    g.fillStyle="rgba(255,255,255,.12)";g.beginPath();g.moveTo(cx,y-hh*.5);g.quadraticCurveTo(cx-hw*.3,y,cx-hw*.85,y+hh*.4);g.quadraticCurveTo(cx-hw*.3,y+hh*.25,cx,y-hh*.5);g.fill()}})}
function makeBush(v){seed=500+v;const w=200,h=120;return mk(w,h,(g)=>{shadow(g,w/2+24,h-10,80,14,.3);
  for(let i=0;i<7;i++){const x=40+rnd()*120,y=60+rnd()*25,r=26+rnd()*16;ball(g,x,y,r,v%2?P.green:P.lime,"#d0f080","#3f7d22")}
  if(v%2===0){for(let i=0;i<6;i++){g.fillStyle=["#ff8fb3","#fff07a","#ffffff"][i%3];g.beginPath();g.arc(45+rnd()*110,45+rnd()*40,4,0,7);g.fill()}}})}
function makeRock(){const w=180,h=110;return mk(w,h,(g)=>{shadow(g,w/2+20,h-10,70,12,.35);
  const gr=g.createLinearGradient(40,20,140,100);gr.addColorStop(0,"#d6d2c8");gr.addColorStop(1,"#7e786d");g.fillStyle=gr;
  g.beginPath();g.moveTo(30,h-14);g.lineTo(48,48);g.lineTo(88,26);g.lineTo(130,40);g.lineTo(156,h-14);g.closePath();g.fill();
  g.fillStyle="rgba(0,0,0,.15)";g.beginPath();g.moveTo(88,26);g.lineTo(130,40);g.lineTo(156,h-14);g.lineTo(100,h-14);g.closePath();g.fill()})}
function makeCloud(v){seed=700+v*13;const w=420,h=200;return mk(w,h,(g)=>{
  const puffs=[];for(let i=0;i<9;i++)puffs.push([70+rnd()*280,110-rnd()*55,36+rnd()*36]);
  g.fillStyle="rgba(120,160,200,.18)";for(const[x,y,r]of puffs){g.beginPath();g.arc(x+8,y+12,r,0,7);g.fill()}
  for(const[x,y,r]of puffs){const gr=g.createRadialGradient(x-r*.3,y-r*.5,r*.2,x,y,r);gr.addColorStop(0,"#ffffff");gr.addColorStop(1,"#e4f0fb");g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  g.fillStyle="#eef5fc";g.fillRect(70,105,280,0)})}
const TREES=[0,1,2,3,4,5].map(makeTree),PINES=[0,1].map(makePine),BUSHES=[0,1,2].map(makeBush),ROCK=makeRock(),CLOUDS=[0,1,2,3].map(makeCloud);

// ---------- the player's car: grey hatchback seen from behind, STEM plate --
function makeCar(BC){return mk(460,380,(g)=>{const cx=230;
  // ground shadow
  const sg=g.createRadialGradient(cx,352,10,cx,352,220);sg.addColorStop(0,"rgba(0,0,0,.45)");sg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=sg;g.save();g.translate(0,352);g.scale(1,.16);g.translate(0,-352);g.beginPath();g.arc(cx,352,220,0,7);g.fill();g.restore();
  // tyres
  for(const sx of[-1,1]){const x=cx+sx*150;const tg=g.createLinearGradient(x-32,0,x+32,0);tg.addColorStop(0,"#1d1f22");tg.addColorStop(.5,"#3a3d42");tg.addColorStop(1,"#141518");
    g.fillStyle=tg;g.beginPath();g.roundRect(x-32,285,64,72,14);g.fill();g.strokeStyle="rgba(255,255,255,.08)";g.lineWidth=2;for(let i=0;i<5;i++){g.beginPath();g.moveTo(x-22,298+i*12);g.lineTo(x+22,304+i*12);g.stroke()}}
  // mirrors
  for(const sx of[-1,1]){const mg=g.createLinearGradient(0,95,0,135);mg.addColorStop(0,BC[0]);mg.addColorStop(1,BC[2]);g.fillStyle=mg;g.beginPath();g.ellipse(cx+sx*178,118,30,18,sx*-.15,0,7);g.fill()}
  // body
  const body=new Path2D();body.moveTo(cx-120,42);body.bezierCurveTo(cx-60,26,cx+60,26,cx+120,42);body.bezierCurveTo(cx+150,60,cx+160,110,cx+170,150);
  body.bezierCurveTo(cx+190,200,cx+195,250,cx+185,295);body.bezierCurveTo(cx+180,318,cx+150,326,cx+120,326);body.lineTo(cx-120,326);
  body.bezierCurveTo(cx-150,326,cx-180,318,cx-185,295);body.bezierCurveTo(cx-195,250,cx-190,200,cx-170,150);body.bezierCurveTo(cx-160,110,cx-150,60,cx-120,42);body.closePath();
  const bg=g.createLinearGradient(0,30,0,330);bg.addColorStop(0,BC[0]);bg.addColorStop(.45,BC[1]);bg.addColorStop(.75,BC[2]);bg.addColorStop(1,BC[3]);g.fillStyle=bg;g.fill(body);
  // side shading for roundness
  const sh=g.createLinearGradient(cx-195,0,cx+195,0);sh.addColorStop(0,"rgba(0,0,0,.28)");sh.addColorStop(.18,"rgba(0,0,0,0)");sh.addColorStop(.82,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.32)");g.fillStyle=sh;g.fill(body);
  // rear window
  const win=new Path2D();win.moveTo(cx-108,58);win.bezierCurveTo(cx-50,44,cx+50,44,cx+108,58);win.bezierCurveTo(cx+124,82,cx+132,108,cx+136,132);win.lineTo(cx-136,132);win.bezierCurveTo(cx-132,108,cx-124,82,cx-108,58);win.closePath();
  const wg=g.createLinearGradient(0,50,0,135);wg.addColorStop(0,"#9fb8cc");wg.addColorStop(1,"#3c5368");g.fillStyle=wg;g.fill(win);
  g.save();g.clip(win);g.fillStyle="rgba(255,255,255,.28)";g.beginPath();g.moveTo(cx-90,50);g.lineTo(cx-40,50);g.lineTo(cx-110,140);g.lineTo(cx-160,140);g.fill();g.restore();
  g.strokeStyle="#2a2d31";g.lineWidth=3;g.stroke(win);
  // wiper
  g.strokeStyle="#1d1f22";g.lineWidth=7;g.lineCap="round";g.beginPath();g.moveTo(cx+4,124);g.lineTo(cx+70,98);g.stroke();g.fillStyle="#1d1f22";g.beginPath();g.arc(cx+2,124,7,0,7);g.fill();
  // roof spoiler light
  g.fillStyle="#e8483a";g.beginPath();g.roundRect(cx-26,36,52,7,3);g.fill();
  // trunk lid line
  g.strokeStyle="rgba(40,44,48,.55)";g.lineWidth=3;g.beginPath();g.moveTo(cx-150,150);g.bezierCurveTo(cx-148,215,cx-120,238,cx-60,240);g.lineTo(cx+60,240);g.bezierCurveTo(cx+120,238,cx+148,215,cx+150,150);g.stroke();
  // trunk handle
  g.fillStyle="#2d3135";g.beginPath();g.roundRect(cx-40,226,80,12,5);g.fill();
  // taillights, shaped like the drawing
  for(const sx of[-1,1]){g.save();g.translate(cx+sx*150,166);g.scale(sx,1);
    const tl=new Path2D();tl.moveTo(-42,-18);tl.lineTo(22,-22);tl.quadraticCurveTo(36,-6,30,18);tl.lineTo(-44,16);tl.quadraticCurveTo(-52,0,-42,-18);tl.closePath();
    const lg=g.createLinearGradient(0,-22,0,18);lg.addColorStop(0,"#ff8a7a");lg.addColorStop(.5,"#e1281f");lg.addColorStop(1,"#8f1510");g.fillStyle=lg;g.fill(tl);
    g.strokeStyle="#3a1a16";g.lineWidth=2.5;g.stroke(tl);g.fillStyle="rgba(255,255,255,.75)";g.beginPath();g.roundRect(-30,-14,26,6,3);g.fill();
    g.fillStyle="rgba(255,240,240,.7)";g.fillRect(6,-14,12,26);g.restore()}
  // bumper
  const bump=new Path2D();bump.moveTo(cx-180,268);bump.bezierCurveTo(cx-120,280,cx+120,280,cx+180,268);bump.lineTo(cx+182,300);bump.bezierCurveTo(cx+150,322,cx-150,322,cx-182,300);bump.closePath();
  const bb=g.createLinearGradient(0,268,0,322);bb.addColorStop(0,"#6d737a");bb.addColorStop(1,"#3f4348");g.fillStyle=bb;g.fill(bump);
  g.fillStyle="#24272a";g.beginPath();g.roundRect(cx-70,248,140,18,8);g.fill();
  // reflectors
  for(const sx of[-1,1]){g.fillStyle="#c9271e";g.beginPath();g.roundRect(cx+sx*150-22,282,44,10,5);g.fill()}
  // licence plate
  g.fillStyle="#f6f6f2";g.strokeStyle="#2a2d31";g.lineWidth=3;g.beginPath();g.roundRect(cx-62,276,124,34,6);g.fill();g.stroke();
  g.fillStyle="#1f2226";g.font="700 26px Fredoka, 'Trebuchet MS', sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText("STEM",cx,294);
  // highlight along the roof
  g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=3;g.beginPath();g.moveTo(cx-100,40);g.bezierCurveTo(cx-40,30,cx+40,30,cx+100,40);g.stroke();
  g.strokeStyle="#2a2d31";g.lineWidth=3;g.stroke(body);
})}
const CAR=makeCar(["#d5dade","#9da4ab","#7f868e","#5c6269"]),BLUE=makeCar(["#a9cdfb","#4a86df","#2f62b6","#1d3f7e"]),RED=makeCar(["#ffb1a3","#e2483a","#b42f22","#741a12"]);
const CAR_GLOW=mk(160,120,(g)=>{const gr=g.createRadialGradient(80,60,4,80,60,60);gr.addColorStop(0,"rgba(255,80,60,.9)");gr.addColorStop(1,"rgba(255,40,20,0)");g.fillStyle=gr;g.fillRect(0,0,160,120)});

// ---------- backdrop: mountains as in the drawing ---------------------
// a big central peak, a sharp peak on the left, rolling hills and a brown
// rocky top on the right.  Drawn wider than the screen and wrapped.
const BACK_W=1800;
function ridgeCanvas(peaks,h,baseCol,shadeCol,litCol,haze,brownAt){return mk(BACK_W,h,(g)=>{
  const pts=[];for(let x=0;x<=BACK_W;x+=6){let y=h*0.95;
    for(const[px,ph,pw]of peaks){for(const off of[-BACK_W,0,BACK_W]){const d=(x-px-off)/pw;y=Math.min(y,h*0.95-ph*Math.exp(-d*d)*(1-Math.abs(Math.sin(x*0.05))*0.03))}}
    y+=Math.sin(x*0.031)*4+Math.sin(x*0.013)*6;pts.push([x,y])}
  const path=new Path2D();path.moveTo(0,h);for(const[x,y]of pts)path.lineTo(x,y);path.lineTo(BACK_W,h);path.closePath();
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,litCol);gr.addColorStop(.6,baseCol);gr.addColorStop(1,baseCol);g.fillStyle=gr;g.fill(path);
  g.save();g.clip(path);
  // shaded right-hand faces of each peak (sun from the left)
  for(const[px,ph,pw]of peaks)for(const off of[0,BACK_W,-BACK_W]){const x=px+off,top=h*0.95-ph;
    const sg=g.createLinearGradient(x,0,x+pw*1.4,0);sg.addColorStop(0,shadeCol);sg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=sg;
    g.beginPath();g.moveTo(x,top);g.lineTo(x+pw*1.6,h);g.lineTo(x+pw*0.15,h);g.closePath();g.fill();
    // brown rock streaks like the crayon
    g.strokeStyle="rgba(150,96,62,.35)";g.lineWidth=5;g.lineCap="round";

const ease=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);

function road(e,h,l,curve,hill){const sy=lastY(),ey=sy+hill*SEG,t=e+h+l;
  for(let i=0;i<e;i++)addSeg(ease(0,curve,i/e),ease(sy,ey,i/t));for(let i=0;i<h;i++)addSeg(curve,ease(sy,ey,(e+i)/t));for(let i=0;i<l;i++)addSeg(ease(curve,0,i/l),ease(sy,ey,(e+h+i)/t))}

function render(){
  const base=findSeg(pos),bp=(pos%SEG)/SEG,ps=findSeg(pos+PLAYERZ),pp=((pos+PLAYERZ)%SEG)/SEG;const py=lerp(ps.p1.world.y,ps.p2.world.y,pp);

  let maxy=H,x=0,dx=-(base.curve*bp);
  for(let n=0;n<DRAW;n++){const s=segs[(base.index+n)%segs.length],looped=s.index<base.index;s.clip=maxy;s.vis=false;
    project(s.p1,playerX*ROADW-x,py+CAMH,pos-(looped?trackLen:0));project(s.p2,playerX*ROADW-x-dx,py+CAMH,pos-(looped?trackLen:0));
    x+=dx;dx+=s.curve;
    if(s.p1.camera.z<=CAMD||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy)continue;
    drawSegment(s,n);s.vis=true;maxy=s.p1.screen.y}

  for(const r of rivals){const z=rivalZ(r),rs=findSeg(z),rn=(rs.index-base.index+segs.length)%segs.length;if(rn<1||rn>=DRAW)continue;
    const e={r,rp:(z%SEG)/SEG,s:rs,n:rn};if(r.total>=pTotal)(ahead[rn]=ahead[rn]||[]).push(e);else behind.push(e)}
  for(let n=DRAW-1;n>0;n--){const s=segs[(base.index+n)%segs.length];if(s.p1.camera.z<=CAMD)continue;
    for(const sp of s.sprites)drawSprite(s,sp,n);for(const it of s.items)if(!it.taken)drawItem(s,it,n);
    if(ahead[n])for(const e of ahead[n])drawRival(s,e.r,e.rp,n)}
  if(th.night)drawBeams();
  drawCar();
  behind.sort((a,b)=>b.n-a.n);for(const e of behind)if(e.s.p1.camera.z>CAMD)drawRival(e.s,e.r,e.rp,e.n);
  if(th.sun){const lg=ctx.createRadialGradient(110,95,0,110,95,520);lg.addColorStop(0,"rgba(255,240,190,.18)");lg.addColorStop(1,"rgba(255,240,190,0)");ctx.fillStyle=lg;ctx.fillRect(0,0,W,H)}

  ctx.restore();

function updateRivals(dt){if(state!=="play"&&state!=="finished")return;
  for(const r of rivals){const rs=findSeg(rivalZ(r));let target=MAXS*r.pace*(1-Math.min(0.25,Math.abs(rs.curve)*0.03));const gap=r.total-pTotal;
    if(state==="play"){if(gap>SEG*14)target*=0.9;else if(gap<-SEG*12)target*=1.16}
    r.speed=Math.min(target,r.speed+ACC*0.85*dt);if(r.speed>target)r.speed=Math.max(target,r.speed+DECEL*dt);
    r.laneT-=dt;if(r.laneT<=0){r.laneT=3+Math.random()*4;const nt=r.tx>0?-0.5:0.5;if(!(Math.abs(gap)<SEG*5&&overlap(nt,PLAYER_W,playerX,PLAYER_W)))r.tx=nt}
    if(gap<0&&gap>-SEG*5&&overlap(r.x,PLAYER_W,playerX,PLAYER_W))r.tx=playerX>0?-0.55:0.55;
    for(const o of rivals)if(o!==r&&o.total>r.total&&o.total-r.total<SEG*3&&Math.abs(o.tx-r.tx)<0.3)r.tx=o.tx>0?-0.5:0.5;
    r.x+=(r.tx-r.x)*Math.min(1,dt*1.5);r.total+=r.speed*dt;
    if(r.fin==null&&r.total>=lv.laps*trackLen){r.fin=raceT;if(state==="play")say(r.name+" finished!","#ffd34d")}}}
function hitHazard(kind){
  if(kind==="rock"){if(invuln>0)return;lives--;invuln=1.6;speed=MAXS/8;boost=0;shake=1.1;
    if(lives<=0){lives=0;state="crashed";finT=1.2;say("Out of lives!","#ff6a4d")}else say("Ouch! −1 ♥","#ff6a4d")}
  else{speed=Math.min(speed,MAXS*0.32);shake=0.8;boost=0;say("Bump! A hole!","#ffb36b")}}
function update(dt){t+=dt;if(flash)flash.t-=dt*0.9;if(shake>0)shake=Math.max(0,shake-dt*3);if(boost>0)boost-=dt;if(invuln>0)invuln-=dt;bumpT-=dt;
  for(const c of clouds)c.x+=c.v*dt;
  if(state==="between"){bt-=dt;if(bt<=0){state="count";cd=2.2}}
  if(state==="count"){cd-=dt;if(cd<=0){state="play";say("GO!","#7ff09a")}}
  if(state==="play"||state==="finished")raceT+=dt;
  const ps=findSeg(pos+PLAYERZ),sp=speed/MAXS,dx=dt*2.3*sp,run=state==="play";
  const Lk=run&&keys.left,Rk=run&&keys.right,U=run&&keys.up,D=run&&keys.down;
  steer+=((Lk?-1:Rk?1:0)-steer)*Math.min(1,dt*8);
  if(Lk)playerX-=dx;else if(Rk)playerX+=dx;playerX-=dx*sp*ps.curve*CENTRI;
  const top=boost>0?MAXS*1.25:MAXS;
  if(U||(boost>0&&run))speed+=(boost>0?ACC*1.8:ACC)*dt;else if(D)speed+=BRAKE*dt;else speed+=DECEL*(run?1:2)*dt;
  if(speed>top)speed=Math.max(top,speed+DECEL*2*dt);
  if(Math.abs(playerX)>1&&speed>OFFLIM)speed+=OFFDEC*dt;
  if(Math.abs(playerX)>1.1&&bumpT<=0)for(const s of ps.sprites){if(!s.hit)continue;const ww=s.h*s.c.width/s.c.height/ROADW*s.col;
    if(overlap(playerX,PLAYER_W,s.o,ww)){speed=MAXS/10;shake=1;bumpT=0.6;boost=0;playerX+=playerX<s.o?-0.1:0.1;say("Bonk!","#ffb36b");break}}
  if(run)for(const seg of[ps,findSeg(pos+PLAYERZ+SEG)])for(const it of seg.items){if(it.taken)continue;
    if(it.t==="coin"&&overlap(playerX,PLAYER_W,it.o,0.32)){it.taken=true;score+=10;levelCoins++;say("+10 ★","#ffd34d")}
    else if(it.t==="letter"&&overlap(playerX,PLAYER_W,it.o,0.42)){it.taken=true;const gi="STEM".indexOf(it.ch);boost=Math.max(boost,1.3);
      if(!got[gi]){got[gi]=1;if(got.every(Boolean)){got=[0,0,0,0];boost=3.5;say("STEM TURBO!","#f39c25")}else say(it.ch+" turbo!",LC[gi])}else say("Turbo!",LC[gi])}
    else if((it.t==="rock"||it.t==="hole")&&overlap(playerX,PLAYER_W*0.85,it.o,0.4)){if(it.t==="rock")it.taken=true;else{if(it.cool>t)continue;it.cool=t+1.5}hitHazard(it.t)}}
  if(run)for(const r of rivals){const gap=r.total-pTotal;
    if(Math.abs(gap)<SEG*1.1&&overlap(playerX,PLAYER_W,r.x,PLAYER_W*0.9)){
      if(gap>0&&speed>r.speed){speed=r.speed*0.8;boost=0;shake=0.6;say("Bump!","#ffd34d")}else if(gap<=0&&r.speed>speed){r.speed=speed*0.8;shake=0.4}
      playerX+=playerX>r.x?dt*1.5:-dt*1.5}}
  playerX=clamp(playerX,-3,3);speed=Math.max(0,speed);
  move(dt*speed);updateRivals(dt);
  if(run&&lv.laps)place=1+rivals.filter(r=>r.total>pTotal).length;
  skyOff+=dt*sp*ps.curve*0.02;
  if(run){if(lv.laps){const lap=Math.floor(pTotal/trackLen)+1;if(lap>lapShown&&lap<=lv.laps){lapShown=lap;say("Final lap!","#ff6a4d")}
      if(pTotal>=lv.laps*trackLen){playerFin=raceT;place=1+rivals.filter(r=>r.fin!=null).length;state="finished";finT=1.1;say(place===1?"1st place!":ORD[place-1]+" place",place===1?"#7ff09a":"#ffd34d")}}
    else if(pTotal/SEG*M_PER_SEG>=lv.goal){playerFin=raceT;place=1;state="finished";finT=1.0;say("Great driving!","#7ff09a")}}
  if(state==="finished"||state==="crashed"){finT-=dt;if(finT<=0)levelDone()}
  if(state==="attract"){speed=MAXS*0.2;playerX+=(0.45-playerX)*dt*2}
}

// ---------- screens
const menu=document.getElementById('menu'),playBtn=document.getElementById('play'),menuText=document.getElementById('menuText'),menuTitle=menu.querySelector('h1'),menuKeys=menu.querySelector('.keys');
let next=null;
function screen(title,html,btn,action,keysShown=false){menuTitle.textContent=title;menuText.innerHTML=html;playBtn.textContent=btn;next=action;menuKeys.hidden=!keysShown;menu.hidden=false;state=state==="attract"?"attract":"over";try{playBtn.focus({preventScroll:true})}catch(e){}}
function begin(i){loadLevel(i);levelStartScore=score;state="count";cd=3.2;menu.hidden=true;cv.focus({preventScroll:true})}
function levelDone(){
  if(state==="crashed"){score=levelStartScore;state="over";screen("Out of lives!","Three rocks got you. Steer around the rocks and holes.","Try again",()=>begin(L));return}
  if(place===1){score+=lv.laps?100:50;totalTime+=playerFin;
    if(L===LEVELS.length-1){let best=0;try{best=+localStorage.getItem('stemRoadBest')||0}catch(e){}const rec=score>best;if(rec)try{localStorage.setItem('stemRoadBest',score)}catch(e){}
      state="over";screen("You win!",`<span class="score">★ ${score}</span><br>All 3 races won · total time ${fmt(totalTime)}${rec?"<br>New best score!":""}`,"Play again",()=>{score=0;totalTime=0;begin(0)});return}
    loadLevel(L+1);levelStartScore=score;state="between";bt=2.4;return}
  score=levelStartScore;state="over";screen("You came "+ORD[place-1],`You need 1st place to go on. Grab the S T E M letters for a turbo!`,"Try again",()=>begin(L))}
playBtn.onclick=()=>next&&next();
const KM={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){keys[k]=true;e.preventDefault()}},{passive:false});
addEventListener('keyup',e=>{const k=KM[e.key];if(k){keys[k]=false;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',e=>{try{b.setPointerCapture(e.pointerId)}catch(_){}on(e)});b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault())});

// title screen with the car rolling gently in the background
loadLevel(0);state="attract";
screen("STEM Road",`3 races in a row:<br><b>1</b> Race the blue car · <b>2</b> Mountain race · <b>3</b> City at night<br>Stars are 10 points, S T E M letters give a turbo.`,"Play",()=>{score=0;totalTime=0;begin(0)},true);
let last=performance.now();
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
